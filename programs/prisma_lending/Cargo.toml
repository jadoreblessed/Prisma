[package]
name = "prisma_lending"
version = "0.1.0"
description = "Paused-by-default isolated lending markets for Prisma"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "prisma_lending"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
chainlink_solana = "2.0.8"

